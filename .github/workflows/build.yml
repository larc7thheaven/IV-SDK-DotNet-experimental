name: Build

on:
  push:
    branches: [ ce-1.2.0.59 ]
  pull_request:
  workflow_dispatch:

env:
  # Official IV-SDK .NET release this branch is based on (provides ScriptHookDotNet.dll for compiling the
  # Manager, and the non-code files of the package). Pinned by hash.
  BASE_RELEASE_URL: https://github.com/ClonkAndre/IV-SDK-DotNet/releases/download/1.9.1/IV-SDK.NET.v1.9.1.zip
  BASE_RELEASE_SHA256: d0ccf6c0c5d87b29d0337eba86947f00c3bb7bf09ad5e355a9bafcb86f7ca973

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: CompleteEdition-1.2.0.59
            cl_flags: ""
          - target: Classic-1.0.7.0-1.0.8.0
            cl_flags: "/DIVSDK_CLASSIC"

    steps:
      - uses: actions/checkout@v4

      # The wrapper uses d3dx9 from the DirectX SDK (June 2010) via $(DXSDK_DIR).
      # Only the x86 headers/libs are extracted; the SDK installer itself is not run.
      - name: Cache DirectX SDK (June 2010)
        id: dxsdk-cache
        uses: actions/cache@v4
        with:
          path: _dxsdk
          key: dxsdk-jun2010-x86

      - name: Download DirectX SDK (June 2010)
        if: steps.dxsdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L --fail -o DXSDK_Jun10.exe "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
          7z x DXSDK_Jun10.exe DXSDK/Include -o_dxsdk -y | Out-Null
          7z x DXSDK_Jun10.exe DXSDK/Lib/x86 -o_dxsdk -y | Out-Null
          if (-not (Test-Path _dxsdk/DXSDK/Include/d3dx9.h)) { 7z l DXSDK_Jun10.exe | Select-String "d3dx9.h"; throw "d3dx9.h not found in SDK archive" }
          Remove-Item DXSDK_Jun10.exe

      - name: Set DXSDK_DIR
        shell: pwsh
        run: echo "DXSDK_DIR=${{ github.workspace }}\_dxsdk\DXSDK\" >> $env:GITHUB_ENV

      - name: Download base release
        shell: pwsh
        run: |
          curl.exe -L --fail -o base.zip "$env:BASE_RELEASE_URL"
          $h = (Get-FileHash base.zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:BASE_RELEASE_SHA256) { throw "Base release hash mismatch: $h" }
          7z x base.zip -o_base -y | Out-Null
          # Manager.csproj references ScriptHookDotNet.dll from this sibling folder
          $shdn = Join-Path (Split-Path "${{ github.workspace }}") "ScriptHookDotNet-for-IVSDKDotNet\Debug"
          New-Item -ItemType Directory -Force $shdn | Out-Null
          Copy-Item _base/IVSDKDotNet/bin/ScriptHookDotNet.dll $shdn

      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore IVSDKDotNet.sln -PackagesDirectory packages

      # Builds IVSDKDotNet.asi, IVSDKDotNetWrapper.dll and IVSDKDotNet.Manager.dll.
      # The Manager must be rebuilt together with the wrapper: the release Manager references the
      # wrapper by its strong name (signed with the original author's key), which this build cannot reproduce.
      - name: Build
        shell: pwsh
        env:
          CL: ${{ matrix.cl_flags }}
        run: |
          # solution filter: the solution minus TestScript/TestPlugin (they need external DLLs)
          msbuild IVSDKDotNet.CI.slnf /m /nologo /v:minimal `
            /p:Configuration=Release /p:Platform=x86

      - name: Check assembly identities
        shell: powershell   # Windows PowerShell 5.1 (.NET Framework) for ReflectionOnlyLoadFrom
        run: |
          $w = [Reflection.AssemblyName]::GetAssemblyName("$pwd\Release\IVSDKDotNetWrapper.dll")
          $m = [Reflection.Assembly]::ReflectionOnlyLoadFrom("$pwd\Manager\bin\x86\Release\IVSDKDotNet.Manager.dll")
          $ref = $m.GetReferencedAssemblies() | Where-Object Name -eq 'IVSDKDotNetWrapper'
          "Wrapper:            $($w.FullName)"
          "Manager references: $($ref.FullName)"
          if ($ref.FullName -ne $w.FullName) { throw "Manager does not reference the wrapper that was built" }

      - name: Assemble package
        shell: pwsh
        run: |
          Copy-Item _base out -Recurse
          Copy-Item Release/IVSDKDotNet.asi, Release/IVSDKDotNetWrapper.dll out -Force
          Copy-Item Release/IVSDKDotNetWrapper.xml out -Force -ErrorAction SilentlyContinue
          Copy-Item Manager/bin/x86/Release/IVSDKDotNet.Manager.dll out/IVSDKDotNet -Force
          Copy-Item "IVSDKDotNet/Memory Offset Config Files/IVSDK/*.ini" out/IVSDK -Force
          Copy-Item Documentation/CompleteEdition.md out
          New-Item -ItemType Directory out/pdb | Out-Null
          Copy-Item Release/*.pdb out/pdb -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse out -File | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName.Substring($pwd.Path.Length + 5) }

      - uses: actions/upload-artifact@v4
        with:
          name: IVSDKDotNet-${{ matrix.target }}
          path: out
